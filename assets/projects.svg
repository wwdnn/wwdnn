</style><text x="24" y="30" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#edf0f6">Selected work</text><text x="24" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#edf0f6">Delivered at PT Neural Technologies Indonesia</text><g transform="translate(16 78)"><rect x="0" y="0" width="426" height="1001" rx="15" fill="#161c26" stroke="#2c3442"/><text x="26" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#b6cff3">Middle Full-stack · 2025–Present</text><text x="26" y="78.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#edf0f6">From hydraulic design</text><text x="26" y="115.94999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#edf0f6">to a ready-to-send quotation.</text><text x="26" y="158.89999999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b6cff3">Hydraulic engineering platform</text><text x="26" y="200.34999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">A calculation change used to take more than ten</text><text x="26" y="223.44999999999996" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">minutes, and turning a lead into a quotation</text><text x="26" y="246.54999999999995" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">took about two weeks. I owned delivery of a</text><text x="26" y="269.65" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">platform that brings engineering calculations</text><text x="26" y="292.74999999999994" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">and commercial workflows together.</text><text x="26.0" y="337.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#b6cff3">40–50</text><text x="26.0" y="361.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#aab8cb">platform users</text><text x="213.0" y="337.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#b6cff3">&lt; 1 week</text><text x="213.0" y="361.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#aab8cb">lead to quotation ·</text><text x="213.0" y="381.65" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#aab8cb">previously ~2 weeks</text><text x="26" y="425.44999999999993" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#edf0f6">Keep editing responsive.</text><text x="26" y="449.44999999999993" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">I separated interactive work from heavy calculations</text><text x="26" y="470.8999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">using server-side services, lazy loading, and</text><text x="26" y="492.3499999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">tree-based processing. Design updates now complete</text><text x="26" y="513.8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">in under a minute.</text><text x="26" y="559.2499999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#edf0f6">Connect the whole workflow.</text><text x="26" y="583.2499999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">CRM, calculations, BOQ, stock, margins, quotations,</text><text x="26" y="604.6999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">and project management share connected data models.</text><text x="26" y="626.1499999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">Corrections fell from nearly every quotation to</text><text x="26" y="647.5999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">about one in ten.</text><text x="26" y="693.0499999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#edf0f6">Validate under load.</text><text x="26" y="717.0499999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">Across 25 stress tests, CPU/RAM usage fell from ~80%</text><text x="26" y="738.4999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">to ≤20%, and failures from 16 to ~2–5. Stress-test</text><text x="26" y="759.9499999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">duration fell from 60+ minutes to at most 30</text><text x="26" y="781.3999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">minutes.</text><text x="26" y="826.8499999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#edf0f6">Check calculation accuracy.</text><text x="26" y="850.8499999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">Results showed ~2% deviation across nearly 30 stack</text><text x="26" y="872.2999999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">scenarios, enabling an internal replacement for</text><text x="26" y="893.7499999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">Keidel DrainStar. The platform supports around 20</text><text x="26" y="915.1999999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">leads and 200 stack calculations each month.</text><rect x="26" y="950.6499999999997" width="58.8" height="25" rx="6" fill="#2c3442"/><text x="35" y="967.6499999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#b6cff3">Python</text><rect x="91.8" y="950.6499999999997" width="86.0" height="25" rx="6" fill="#2c3442"/><text x="100.8" y="967.6499999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#b6cff3">PostgreSQL</text><rect x="184.8" y="950.6499999999997" width="120.0" height="25" rx="6" fill="#2c3442"/><text x="193.8" y="967.6499999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#b6cff3">ERP integration</text></g><g transform="translate(458 78)"><rect x="0" y="0" width="426" height="578" rx="15" fill="#172129" stroke="#2b3e49"/><text x="26" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#bce2e6">Middle Full-stack · 2025–Present</text><text x="26" y="78.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#edf0f6">Gigabyte-scale images.</text><text x="26" y="115.94999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#edf0f6">Browser-scale interaction.</text><text x="26" y="158.89999999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#bce2e6">Whole-slide images &amp; NAS synchronization</text><text x="26" y="200.34999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">For around 400 SVS files, each 5–15 GB,</text><text x="26" y="223.44999999999996" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">downloading the source was impractical. I built</text><text x="26" y="246.54999999999995" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">tiled browser delivery with OpenSlide and Nginx</text><text x="26" y="269.65" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">caching so sessions transfer only the image data</text><text x="26" y="292.74999999999994" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">they need.</text><text x="26.0" y="337.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#bce2e6">300–500 ms</text><text x="26.0" y="361.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#aab8cb">tile response</text><text x="213.0" y="337.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#bce2e6">&lt; 50 MB</text><text x="213.0" y="361.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#aab8cb">transferred per test</text><text x="213.0" y="381.65" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#aab8cb">session</text><text x="26" y="425.44999999999993" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#edf0f6">Keep administration responsive.</text><text x="26" y="449.44999999999993" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">A PostgreSQL-backed queue synchronizes around 400</text><text x="26" y="470.8999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">NAS files in 10–15 minutes without blocking the</text><text x="26" y="492.3499999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">administration interface.</text><rect x="26" y="527.8" width="79.19999999999999" height="25" rx="6" fill="#2b3e49"/><text x="35" y="544.8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#bce2e6">OpenSlide</text><rect x="112.19999999999999" y="527.8" width="52.0" height="25" rx="6" fill="#2b3e49"/><text x="121.19999999999999" y="544.8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#bce2e6">Nginx</text><rect x="171.2" y="527.8" width="133.6" height="25" rx="6" fill="#2b3e49"/><text x="180.2" y="544.8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#bce2e6">Background queues</text></g><g transform="translate(458 678)"><rect x="0" y="0" width="426" height="717" rx="15" fill="#1c1b26" stroke="#363142"/><text x="26" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#d1c2e8">Junior Full-stack · 2023–2025</text><text x="26" y="78.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#edf0f6">Make operational gaps</text><text x="26" y="115.94999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#edf0f6">visible—and actionable.</text><text x="26" y="158.89999999999998" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#d1c2e8">HR analytics &amp; internal integrations</text><text x="26" y="200.34999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">I built contract visibility and automated</text><text x="26" y="223.44999999999996" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">reminders for around 200 employees. No late</text><text x="26" y="246.54999999999995" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">contract detection was observed in the following</text><text x="26" y="269.65" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">monitoring period, compared with 6–7 of 10</text><text x="26" y="292.74999999999994" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab8cb">previously.</text><text x="26" y="339.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#edf0f6">Close the validation gap.</text><text x="26" y="363.84999999999997" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">Working-hour and overlap checks addressed excessive</text><text x="26" y="385.29999999999995" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">or overlapping entries previously found in ~7–8 of</text><text x="26" y="406.74999999999994" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">10 timesheets.</text><text x="26" y="452.19999999999993" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#edf0f6">Make records available sooner.</text><text x="26" y="476.19999999999993" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">REST integrations made tender, vendor, and legal</text><text x="26" y="497.6499999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">documents available in minutes instead of 3–5 days,</text><text x="26" y="519.0999999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">supporting up to around 15 processes per month.</text><text x="26" y="564.55" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#edf0f6">Deliver across business domains.</text><text x="26" y="588.55" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">I maintained modules across HR, projects, tender,</text><text x="26" y="610.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">HSE, and e-learning, collaborating with analysts,</text><text x="26" y="631.4499999999999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#aab8cb">domain experts, and UI/UX teams.</text><rect x="26" y="666.9" width="79.19999999999999" height="25" rx="6" fill="#363142"/><text x="35" y="683.9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#d1c2e8">REST APIs</text><rect x="112.19999999999999" y="666.9" width="99.6" height="25" rx="6" fill="#363142"/><text x="121.19999999999999" y="683.9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#d1c2e8">HR analytics</text><rect x="218.79999999999998" y="666.9" width="86.0" height="25" rx="6" fill="#363142"/><text x="227.79999999999998" y="683.9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#d1c2e8">Automation</text></g>
