    <text x="32" y="44" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="700">wwdnn@github</text>
    <line x1="32" y1="60" x2="456" y2="60" stroke="#8b949e" opacity=".45"/>
