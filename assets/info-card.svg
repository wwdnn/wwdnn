    <g class="line" style="animation-delay:0.22s"><text x="32" y="139" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">Frontend  </text><text x="142" y="139" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">TypeScript · React · Next.js</text></g>
    <g class="line" style="animation-delay:0.32s"><text x="32" y="182" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">Backend   </text><text x="142" y="182" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">Python · Odoo ERP</text></g>
    <g class="line" style="animation-delay:0.42s"><text x="32" y="225" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">Database  </text><text x="142" y="225" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">PostgreSQL</text></g>
    <g class="line" style="animation-delay:0.52s"><text x="32" y="268" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">Focus     </text><text x="142" y="268" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">Web applications and ERP systems</text></g>
